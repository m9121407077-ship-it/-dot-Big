<title>Azura Knowledge Graph — Prism Graph</title>

<!-- IBM Plex Sans Arabic for Persian text + Latin support
     Chosen because IBM Plex was designed with research-based legibility for
     technical/data contexts, and the Arabic variant matches the Latin in
     proportions which keeps the graph visually coherent across scripts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- D3.js v7 from a CDN allowed for offline reading too once cached -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
/* ============================================================================
   DESIGN TOKENS — derived from cognitive load research (Sweller 1988, Tufte 1983)
   The palette is intentionally restricted to one accent + grayscale, applying
   Tufte's "smallest effective difference" and Sweller's extraneous load
   minimization. Each color has a single semantic role.
   ============================================================================ */
:root {
    /* Background — paper-like neutral that reduces eye strain */
    --bg-canvas: #fafafa;
    --bg-panel: #ffffff;
    --bg-panel-subtle: #f4f4f4;
    
    /* Text — high contrast on bg for readability */
    --text-primary: #161616;
    --text-secondary: #525252;
    --text-tertiary: #8d8d8d;
    
    /* Structural grayscale — for entities of varying importance */
    --gray-100: #f4f4f4;
    --gray-200: #e0e0e0;
    --gray-300: #c6c6c6;
    --gray-400: #a8a8a8;
    --gray-500: #8d8d8d;
    --gray-600: #6f6f6f;
    --gray-700: #525252;
    --gray-800: #393939;
    --gray-900: #262626;
    
    /* THE ACCENT — used ONLY for the buyer-critical JV entity and edge.
       Following Treisman & Gelade (1980), this pre-attentive color cue
       enables sub-250ms detection. Warm orange chosen because it contrasts
       maximally against the cool grayscale and is colorblind-friendly. */
    --accent-primary: #da4e1f;
    --accent-soft: #ffd7c8;
    
    /* Operator color — distinct from accent and grayscale, neither competing
       for primary attention nor disappearing into the grayscale. Cool slate. */
    --operator: #4a6670;
    --operator-soft: #d9e2e6;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    /* Persian primary, Latin fallback. font-feature-settings improves
       Persian rendering (kashida, contextual forms) */
    font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', -apple-system, sans-serif;
    font-feature-settings: "ss01", "calt", "liga";
    background: var(--bg-canvas);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* ============================================================================
   LAYOUT — Two-column on desktop, stacked on mobile
   Right column is the graph (RTL: starts on the right side for Persian flow)
   Left column is the details panel
   ============================================================================ */
.app {
    display: grid;
    grid-template-columns: 1fr 360px;
    min-height: 100vh;
    gap: 0;
}

@media (max-width: 900px) {
    /* On mobile, stack panel below graph */
    .app {
        grid-template-columns: 1fr;
    }
}

/* ============================================================================
   HEADER — gives orientation context. Small, low-salience, doesn't compete
   with the graph for attention.
   ============================================================================ */
.header {
    grid-column: 1 / -1;
    padding: 16px 24px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.01em;
}

.header .subtitle {
    font-size: 13px;
    color: var(--text-tertiary);
    font-weight: 400;
}

/* ============================================================================
   GRAPH CANVAS — generous whitespace, paper-like, low chrome
   ============================================================================ */
.graph-container {
    position: relative;
    background: var(--bg-canvas);
    overflow: hidden;
    min-height: 600px;
}

.graph-svg {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 700px;
}

/* Layer band labels — visible but very subtle, applying Tufte's
   smallest effective difference principle */
.layer-label {
    font-size: 10px;
    fill: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    pointer-events: none;
}

.layer-band {
    fill: transparent;
    /* Common region principle (Gestalt) — subtle background grouping */
}

.layer-band.regulatory { fill: rgba(0, 0, 0, 0.012); }
.layer-band.commercial { fill: rgba(0, 0, 0, 0.024); }
.layer-band.development { fill: rgba(218, 78, 31, 0.04); }  /* Subtle accent for JV layer */
.layer-band.product { fill: rgba(0, 0, 0, 0.016); }

/* ============================================================================
   NODES — shape coding per entity_type implements Gestalt similarity.
   Each entity_type has a distinct shape so users can group by glance.
   ============================================================================ */
.node {
    cursor: pointer;
    transition: transform 200ms ease, filter 200ms ease;
}

.node:hover {
    /* Subtle lift on hover — affordance signal */
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
}

.node-shape {
    transition: stroke-width 200ms ease, fill 200ms ease;
}

/* Default node styling */
.node-shape {
    fill: var(--bg-panel);
    stroke: var(--gray-600);
    stroke-width: 1.5;
}

/* Regulator (Oman) — dimmest because it's context, not the focal entity.
   Salience hierarchy principle from Tufte. */
.node.regulator .node-shape {
    fill: var(--gray-100);
    stroke: var(--gray-400);
    stroke-width: 1;
}

.node.regulator .node-label {
    fill: var(--text-tertiary);
}

/* Holdings & Developers — standard salience */
.node.holding .node-shape,
.node.developer .node-shape {
    fill: var(--bg-panel);
    stroke: var(--gray-600);
    stroke-width: 1.5;
}

/* THE KEY ENTITY — Al Mouj Muscat S.A.O.C.
   Combines TWO pre-attentive features (color + size) per Treisman & Gelade
   (1980). Belt-and-suspenders approach ensures detection even under various
   display conditions (mobile, monochrome, vision impairment) */
.node.jv .node-shape {
    fill: var(--accent-soft);
    stroke: var(--accent-primary);
    stroke-width: 2.5;
}

.node.jv .node-label {
    fill: var(--accent-primary);
    font-weight: 600;
}

.node.jv .node-sublabel {
    fill: var(--accent-primary);
    opacity: 0.7;
}

/* Master development & project — medium-high salience, the buyer's
   destination */
.node.master_development .node-shape,
.node.project .node-shape {
    fill: var(--bg-panel);
    stroke: var(--gray-700);
    stroke-width: 1.5;
}

/* Phases — medium salience, the operational divisions */
.node.product_phase .node-shape {
    fill: var(--bg-panel);
    stroke: var(--gray-600);
    stroke-width: 1.5;
}

/* Unit types — slightly lower salience, the leaves */
.node.unit_type .node-shape {
    fill: var(--bg-panel);
    stroke: var(--gray-500);
    stroke-width: 1.25;
}

/* Operators — distinct slate color so they're recognized as a different
   category without competing for primary attention */
.node.operator .node-shape {
    fill: var(--operator-soft);
    stroke: var(--operator);
    stroke-width: 1.5;
}

.node.operator .node-label {
    fill: var(--operator);
}

/* Selected/hovered state — highlight via stroke weight, not color change,
   preserving the salience hierarchy */
.node.selected .node-shape,
.node.hovered .node-shape {
    stroke-width: 3;
    filter: drop-shadow(0 0 0 3px rgba(218, 78, 31, 0.15));
}

/* Node labels — Persian primary */
.node-label {
    font-size: 12px;
    font-weight: 500;
    fill: var(--text-primary);
    text-anchor: middle;
    pointer-events: none;
    dominant-baseline: central;
}

.node-sublabel {
    font-size: 10px;
    font-weight: 400;
    fill: var(--text-tertiary);
    text-anchor: middle;
    pointer-events: none;
}

/* ============================================================================
   EDGES — style encodes edge_type semantically. Solid for containment,
   dashed for partnership, dotted for service, double for buyer-critical.
   This is the Gestalt similarity principle applied to edges.
   ============================================================================ */
.edge {
    fill: none;
    stroke: var(--gray-400);
    stroke-width: 1;
    transition: stroke 200ms ease, stroke-width 200ms ease;
}

/* Hierarchical containment — solid, thin, neutral */
.edge.contains {
    stroke: var(--gray-400);
    stroke-width: 1;
}

/* Ownership (parent → subsidiary) — solid, slightly bolder */
.edge.owns {
    stroke: var(--gray-500);
    stroke-width: 1.25;
}

/* JV partnerships — DASHED because the relationship is horizontal/lateral,
   not vertical/hierarchical. Visual distinction reinforces conceptual difference. */
.edge.joint_venture_with {
    stroke: var(--gray-600);
    stroke-width: 1.5;
    stroke-dasharray: 4 3;
}

/* Develops — solid, bolder than contains because it's a more semantic relation */
.edge.develops {
    stroke: var(--gray-700);
    stroke-width: 1.5;
}

/* THE BUYER-CRITICAL EDGE — Al Mouj S.A.O.C. → Azura as contractual party.
   Bold + accent color makes it pre-attentive. This is the relationship the
   buyer most needs to see and understand. */
.edge.contractual_party_for_buyer {
    stroke: var(--accent-primary);
    stroke-width: 2.5;
}

/* Operations — DOTTED because operators are off-hierarchy services, not
   part of the ownership/development chain */
.edge.operates,
.edge.finances {
    stroke: var(--operator);
    stroke-width: 1;
    stroke-dasharray: 1 3;
}

/* Regulation — VERY faint dotted, because regulator presence is contextual */
.edge.regulates {
    stroke: var(--gray-400);
    stroke-width: 0.75;
    stroke-dasharray: 2 4;
    opacity: 0.5;
}

/* Hovered edge — brighten without changing color */
.edge.hovered {
    stroke-width: 3;
    opacity: 1;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.1));
}

/* Dimmed state when a node is selected — non-related edges fade */
.edge.dimmed {
    opacity: 0.15;
}

.node.dimmed {
    opacity: 0.3;
}

/* ============================================================================
   DETAILS PANEL — right side (LTR start in RTL = visually on the left edge)
   Shows entity details on hover/click. Information appears progressively,
   honoring CLT germane load principle.
   ============================================================================ */
.details-panel {
    background: var(--bg-panel);
    border-left: 1px solid var(--gray-200);
    padding: 24px;
    overflow-y: auto;
    max-height: 100vh;
}

@media (max-width: 900px) {
    .details-panel {
        border-left: none;
        border-top: 1px solid var(--gray-200);
        max-height: none;
    }
}

.panel-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
}

.panel-entity-name {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
}

.panel-entity-type {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
}

.panel-section {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--gray-100);
}

.panel-section:last-child {
    border-bottom: none;
}

.panel-section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
}

.panel-fact {
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.6;
    margin-bottom: 12px;
}

.panel-fact-meta {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
}

.panel-source-class {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
    margin-right: 6px;
}

.panel-source-class.class-1 { background: #d4f1d4; color: #1f5e1f; }
.panel-source-class.class-2 { background: #d9e9f5; color: #1e4d72; }
.panel-source-class.class-3 { background: #f5e9d9; color: #7a4f1e; }
.panel-source-class.class-4 { background: #f5e0e0; color: #6e2727; }

.panel-empty {
    color: var(--text-tertiary);
    font-size: 13px;
    text-align: center;
    padding: 40px 16px;
    font-style: italic;
}

/* Legend — minimal, at bottom of panel. Implements similarity principle by
   showing shape→type mapping that's already visible in the graph */
.legend {
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid var(--gray-100);
}

.legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
}

.legend-shape {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Question-back styling — these are the buyer-side outputs, deserve emphasis */
.question-back {
    background: var(--bg-panel-subtle);
    border-right: 3px solid var(--accent-primary);
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
}

.question-back-label {
    font-size: 10px;
    color: var(--accent-primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
}
</style>
</head>

    {y: 140, height: 90, label: 'هلدینگ‌های مادر', class: 'commercial'},

// ============================================================================
// RENDER — build the SVG with D3
// We use explicit positioning rather than force-simulation for deterministic
// Sugiyama-style layout. This ensures zero edge crossings in the primary view
// and gives precise control over salience hierarchy.
// ============================================================================

const width = 1200;
const height = 880;

const svg = d3.select('#graph')
    .attr('viewBox', `0 0 ${width} ${height}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

// Layer backgrounds (Gestalt common-region principle)
// Drawn first so they sit behind everything
const layerGroups = svg.selectAll('.layer-band')
    .data(layers)
    .enter().append('g');

layerGroups.append('rect')
    .attr('class', d => `layer-band ${d.class}`)
    .attr('x', 0)
    .attr('y', d => d.y)
    .attr('width', width)
    .attr('height', d => d.height);

layerGroups.append('text')
    .attr('class', 'layer-label')
    .attr('x', width - 20)
    .attr('y', d => d.y + 14)
    .attr('text-anchor', 'end')
    .text(d => d.label);

// Build node lookup for edge routing
const nodeById = new Map(nodes.map(n => [n.id, n]));

// Edges first (so they sit behind nodes)
// Curved paths reduce visual sharpness and follow Gestalt continuity principle.
// Straight lines work for short hops; curves smooth the longer JV-formation
// triangular paths to reduce angular conflict.
const edgeGroup = svg.append('g').attr('class', 'edges');

const edgePaths = edgeGroup.selectAll('.edge')
    .data(edges)
    .enter().append('path')
    .attr('class', d => `edge ${d.type}`)
    .attr('d', d => {
        const s = nodeById.get(d.source);
        const t = nodeById.get(d.target);
        if (!s || !t) return '';
        
        // For mostly-vertical edges, use simple line
        // For diagonal JV-formation edges, use a smooth curve through control point
        const dx = t.x - s.x;
        const dy = t.y - s.y;
        
        if (Math.abs(dx) < 50) {
            // Near-vertical: straight line is cleanest
            return `M${s.x},${s.y} L${t.x},${t.y}`;
        } else {
            // Diagonal: gentle curve via cubic bezier
            // Control points biased toward vertical flow to maintain hierarchy clarity
            const cx1 = s.x;
            const cy1 = s.y + dy * 0.5;
            const cx2 = t.x;
            const cy2 = s.y + dy * 0.5;
            return `M${s.x},${s.y} C${cx1},${cy1} ${cx2},${cy2} ${t.x},${t.y}`;
        }
    })
    .on('mouseenter', function(event, d) {
        d3.select(this).classed('hovered', true);
        showEdgeDetails(d);
    })
    .on('mouseleave', function(event, d) {
        d3.select(this).classed('hovered', false);
    })
    .on('click', function(event, d) {
        event.stopPropagation();
        showEdgeDetails(d);
    });

// Nodes
const nodeGroup = svg.append('g').attr('class', 'nodes');

const nodeElems = nodeGroup.selectAll('.node')
    .data(nodes)
    .enter().append('g')
    .attr('class', d => `node ${d.type}${d.role ? ' ' + d.role : ''}`)
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .on('mouseenter', function(event, d) {
        d3.select(this).classed('hovered', true);
        // Highlight connected edges
        edgePaths.classed('dimmed', e => e.source !== d.id && e.target !== d.id);
        nodeElems.classed('dimmed', n => {
            if (n.id === d.id) return false;
            return !edges.some(e => 
                (e.source === d.id && e.target === n.id) ||
                (e.target === d.id && e.source === n.id)
            );
        });
    })
    .on('mouseleave', function(event, d) {
        d3.select(this).classed('hovered', false);
        edgePaths.classed('dimmed', false);
        nodeElems.classed('dimmed', false);
    })
    .on('click', function(event, d) {
        event.stopPropagation();
        showNodeDetails(d);
    });

// Draw the appropriate shape for each entity type.
// Shape coding implements Gestalt similarity — users can group by glance
// without needing a legend.
nodeElems.each(function(d) {
    const node = d3.select(this);
    
    // Size — pre-attentive cue. Key entity (JV) is 30% larger.
    const baseW = 130, baseH = 38;
    const w = d.role === 'key' ? baseW * 1.3 : baseW;
    const h = d.role === 'key' ? baseH * 1.3 : baseH;
    
    switch(d.type) {
        case 'country':
            // Ellipse — distinct from companies, signals "place/jurisdiction"
            node.append('ellipse')
                .attr('class', 'node-shape')
                .attr('rx', w * 0.55)
                .attr('ry', h * 0.55);
            break;
            
        case 'holding':
        case 'developer':
            // Rectangle — standard for companies
            node.append('rect')
                .attr('class', 'node-shape')
                .attr('x', -w/2).attr('y', -h/2)
                .attr('width', w).attr('height', h);
            break;
            
        case 'jv':
            // Hexagon — distinct shape for the KEY entity, supplementing
            // color and size differentiation (multi-channel pre-attentive)
            const r = w/2;
            const hexPoints = [
                [-r, 0], [-r*0.5, -h*0.65], [r*0.5, -h*0.65],
                [r, 0], [r*0.5, h*0.65], [-r*0.5, h*0.65]
            ].map(p => p.join(',')).join(' ');
            node.append('polygon')
                .attr('class', 'node-shape')
                .attr('points', hexPoints);
            break;
            
        case 'master_development':
        case 'project':
            // Rounded rectangle — signals "place/development"
            node.append('rect')
                .attr('class', 'node-shape')
                .attr('x', -w/2).attr('y', -h/2)
                .attr('width', w).attr('height', h)
                .attr('rx', 18).attr('ry', 18);
            break;
            
        case 'product_phase':
            // Diamond (rotated square) — signals sub-product/phase
            const pw = w * 0.7;
            node.append('rect')
                .attr('class', 'node-shape')
                .attr('x', -pw/2).attr('y', -pw/2)
                .attr('width', pw).attr('height', pw)
                .attr('transform', 'rotate(45)');
            break;
            
        case 'unit_type':
            // Small square — leaves of the tree
            node.append('rect')
                .attr('class', 'node-shape')
                .attr('x', -w*0.42).attr('y', -h*0.6)
                .attr('width', w * 0.85).attr('height', h * 1.2)
                .attr('rx', 4);
            break;
            
        case 'operator':
            // Octagon — clearly distinct from rectangles to signal service role
            const or = w/2;
            const oh = h/2;
            const a = or * 0.4;
            const octPoints = [
                [-or, -oh+a], [-or+a, -oh], [or-a, -oh], [or, -oh+a],
                [or, oh-a], [or-a, oh], [-or+a, oh], [-or, oh-a]
            ].map(p => p.join(',')).join(' ');
            node.append('polygon')
                .attr('class', 'node-shape')
                .attr('points', octPoints);
            break;
    }
    
    // Primary label (Persian)
    node.append('text')
        .attr('class', 'node-label')
        .attr('y', d.subname ? -4 : 2)
        .text(d.name);
    
    // Subname (Latin or descriptive)
    if (d.subname) {
        node.append('text')
            .attr('class', 'node-sublabel')
            .attr('y', 10)
            .text(d.subname);
    }
});

const panel = document.getElementById('panel-content');

function showWelcome() {

    `;
}

function showNodeDetails(d) {
    let html = '';
    
    html += `<div class="panel-title">موجودیت</div>`;
    html += `<div class="panel-entity-name">${d.name}</div>`;
    if (d.subname) html += `<div class="panel-entity-type">${d.subname}</div>`;
    html += `<div class="panel-entity-type">نوع: ${typeLabel(d.type)}</div>`;
    
    if (d.atoms && d.atoms.length > 0) {
        html += `<div class="panel-section">`;
        html += `<div class="panel-section-title">یافته‌های مستند (${d.atoms.length})</div>`;
        d.atoms.forEach(atom => {
            html += `<div class="panel-fact">${atom.claim}`;
            html += `<div class="panel-fact-meta">`;
            html += `<span class="panel-source-class class-${atom.sourceClass}">منبع کلاس ${atom.sourceClass}</span>`;
            html += `${atom.source}`;
            html += `</div></div>`;
        });
        html += `</div>`;
    }
    
    if (d.missingness && d.missingness.length > 0) {
        html += `<div class="panel-section">`;
        html += `<div class="panel-section-title">سؤال‌های لازم قبل از امضای SPA</div>`;
        d.missingness.forEach(m => {
            html += `<div class="question-back">`;
            html += `<div class="question-back-label">${m.severity === 'critical' ? 'بحرانی' : 'متوسط'}: ${m.subject}</div>`;
            html += m.question;
            html += `</div>`;
        });
        html += `</div>`;
    }
    
    panel.className = '';
    panel.innerHTML = html;
}

function showEdgeDetails(d) {
    const sNode = nodeById.get(d.source);
    const tNode = nodeById.get(d.target);
    
    let html = '';
    html += `<div class="panel-title">رابطه</div>`;
    html += `<div class="panel-entity-name">${edgeLabel(d.type)}</div>`;
    html += `<div class="panel-entity-type">${sNode.name} ← ${tNode.name}</div>`;
    
    html += `<div class="panel-section">`;
    html += `<div class="panel-section-title">توضیح</div>`;
    html += `<div class="panel-fact">${d.label}</div>`;
    html += `</div>`;
    
    if (d.type === 'contractual_party_for_buyer') {
        html += `<div class="panel-section">`;
        html += `<div class="panel-section-title">چرا این رابطه برای خریدار حیاتی است</div>`;
        html += `<div class="panel-fact">`;
        html += `این یال نشان می‌دهد خریدار با کدام نهاد حقوقی واقعاً قرارداد می‌بندد. `;
        html += `در دعاوی حقوقی، خریدار صرفاً با Al Mouj Muscat S.A.O.C. — نهاد عمانی JV — طرف است، `;
        html += `نه با برند Al Mouj یا MAF Holding. این تمایز در همه‌ی تحلیل‌های حقوقی buyer-side پایه‌ای است.`;
        html += `</div></div>`;
    }
    
    panel.className = '';
    panel.innerHTML = html;
}

function typeLabel(type) {
    const labels = {
        country: 'کشور / قانون‌گذار',
        holding: 'هلدینگ مادر',
        developer: 'توسعه‌دهنده‌ی شریک',
        jv: 'Joint Venture — کلیدی buyer-side',

        product_phase: 'فاز محصول',
        unit_type: 'نوع واحد',
        operator: 'اپراتور خدمات'
    };
    return labels[type] || type;
}

function edgeLabel(type) {
    const labels = {
        owns: 'مالکیت',
        joint_venture_with: 'شراکت JV',
        develops: 'توسعه‌دهنده',

    return labels[type] || type;
}
